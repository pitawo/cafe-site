<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="チーズケーキのイラスト">
  <circle cx="100" cy="100" r="90" fill="#d4e9e2"/>
  <ellipse cx="100" cy="140" rx="70" ry="14" fill="#ffffff" stroke="#006241" stroke-width="3"/>

  <!-- 断面（背面が垂直、底が水平、前面だけが斜めのくさび形） -->
  <!-- クラスト（底） -->
  <path d="M55,132 L145,132 L136.7,120 L55,120 Z" fill="#cba258"/>
  <!-- 生地（本体） -->
  <path d="M55,120 L136.7,120 L105.4,75 L55,75 Z" fill="#ffffff"/>
  <!-- 上面（焼き色） -->
  <path d="M55,75 L105.4,75 L95,60 L55,60 Z" fill="#cba258" fill-opacity="0.7"/>

  <path d="M55,60 L55,132 L145,132 L95,60 Z" fill="none" stroke="#006241" stroke-width="3" stroke-linejoin="round"/>
  <line x1="55" y1="120" x2="136.7" y2="120" stroke="#006241" stroke-width="2"/>
</svg>
